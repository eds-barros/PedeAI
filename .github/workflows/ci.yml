name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pedeai
          POSTGRES_PASSWORD: pedeai
          POSTGRES_DB: pedeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedeai -d pedeai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pedeai:pedeai@localhost:5432/pedeai_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: "7"
      CORS_ORIGIN: http://localhost:3001
      APP_URL: http://localhost:3001
      NODE_ENV: test
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run build
