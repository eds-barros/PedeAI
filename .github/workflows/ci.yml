name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pedeai
          POSTGRES_PASSWORD: pedeai
          POSTGRES_DB: pedeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedeai -d pedeai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pedeai:pedeai@localhost:5432/pedeai_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: "7"
      CORS_ORIGIN: http://localhost:3001
      APP_URL: http://localhost:3001
      NODE_ENV: test
      LOG_LEVEL: warn
      LOGIN_MAX_FALHAS_EMAIL: "5"
      LOGIN_MAX_FALHAS_IP: "20"
      LOGIN_JANELA_MIN: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run test:qa
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sobe Postgres e API
        run: docker compose up -d --build
      - name: Espera GET /api/v1/health
        run: |
          for _ in $(seq 1 36); do
            if curl -sf http://127.0.0.1:3000/api/v1/health; then
              echo
              echo "API saudável"
              exit 0
            fi
            sleep 5
          done
          echo "A API não respondeu em /api/v1/health"
          docker compose ps
          docker compose logs --no-color api
          exit 1
      - name: Derruba o Compose
        if: always()
        run: docker compose down -v
